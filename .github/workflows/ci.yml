name: JobTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # 1. Backend CI: Java 21 LTS + Maven Tests & Verification
  # -----------------------------------------------------------------
  backend-ci:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Maven Unit & Integration Tests
        run: ./mvnw clean test --no-transfer-progress

      - name: Package Backend Application JAR
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Upload Test Report Artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # -----------------------------------------------------------------
  # 2. Frontend CI: Node.js 20 + Production SPA Build
  # -----------------------------------------------------------------
  frontend-ci:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React / Vite Production Bundle
        run: npm run build

  # -----------------------------------------------------------------
  # 3. Container & Docker Compose Verification
  # -----------------------------------------------------------------
  docker-ci:
    name: Docker Multi-Stage Image Builds & Compose Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Environment File for Compose Validation
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config

      - name: Build Spring Boot Backend Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jobtrack-backend:latest

      - name: Build React/Nginx Frontend Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: jobtrack-frontend:latest
