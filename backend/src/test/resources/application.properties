# ===================================================================
# Test Environment Configuration (H2 In-Memory Database)
# ===================================================================

spring.datasource.url=jdbc:h2:mem:jobtrack_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security & JWT Configuration
app.jwt.secret=JobTrackSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForSecurityCompliance2026!
app.jwt.expiration-ms=86400000

# ===================================================================
# Spring Boot Actuator Configuration (Health, Info, Metrics)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.info.env.enabled=true

# Application Info metadata exposed via /actuator/info
info.app.name=JobTrack Career Application Engine
info.app.description=Production-ready Full-Stack Job Application Tracker & Career Pipeline Analytics
info.app.version=1.0.0
info.app.status=RUNNING

# ===================================================================
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework=WARN
logging.level.com.jobtrack=INFO
