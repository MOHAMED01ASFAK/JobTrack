# ===================================================================
# JobTrack Backend - Application Configuration
# ===================================================================

# Application & Server
spring.application.name=jobtrack-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
# Supports DB_URL or individual DB_HOST, DB_PORT, DB_NAME, DB_USERNAME/DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobtrack_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.jobtrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:JobTrackSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForSecurityCompliance2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Spring Boot Actuator Configuration (Health, Info, Metrics)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.info.env.enabled=true

# Application Info metadata exposed via /actuator/info
info.app.name=JobTrack Career Application Engine
info.app.description=Production-ready Full-Stack Job Application Tracker & Career Pipeline Analytics
info.app.version=1.0.0
info.app.status=RUNNING

# ===================================================================
# SpringDoc OpenAPI 3 / Swagger UI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true

# OpenAPI Server URLs
app.openapi.prod-url=${PROD_URL:https://jobtrack-production-b276.up.railway.app}
app.openapi.local-url=${LOCAL_URL:http://localhost:8080}

